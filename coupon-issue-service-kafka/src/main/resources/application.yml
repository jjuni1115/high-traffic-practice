

spring:
  data:
    redis:
      host: localhost
      port: 6379

  application:
    name: coupon-issue-service-kafka

  kafka:
    producer:
      acks: 1
      retries: 0
      linger-ms: 0
      batch-size: 16384
      compression-type: lz4

      bootstrap-servers: localhost:9092
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false


  datasource:
    username: root
    password: 1115
    url: jdbc:mariadb://localhost:3306/coupon?useSSL=false&serverTimezone=Asia/Seoul
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    generate-ddl: off
server:
  port: 9090